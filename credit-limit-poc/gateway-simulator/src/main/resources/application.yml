spring:
  application:
    name: gateway-simulator
  main:
    web-application-type: none
    banner-mode: off
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5

sim:
  mode: flow
  api-url: http://localhost:8080
  jwt-secret: ${CREDIT_JWT_SECRET:local-dev-secret-change-me-32-bytes-minimum}
  rate: 20
  duration: 60s
  min-notional: 100000
  max-notional: 2000000
  orphan-percent: 1
  requests: 500
  max-in-flight: 2000

logging:
  level:
    root: WARN
    com.poc.credit.sim: INFO
  pattern:
    console: "%d{HH:mm:ss} %msg%n"
