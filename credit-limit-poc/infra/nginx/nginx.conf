worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    # Docker's DNS. Re-resolve every 5 s so a restarted API container is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream credit_api {
        zone credit_api 64k;
        server credit-api-1:8080 resolve max_fails=1 fail_timeout=3s;
        server credit-api-2:8080 resolve max_fails=1 fail_timeout=3s;
        server credit-api-3:8080 resolve max_fails=1 fail_timeout=3s;
        keepalive 128;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://credit_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 200ms;
            proxy_read_timeout 5s;
            # A check is idempotent by order ID, so a POST may safely be retried on another
            # instance when one dies mid-request.
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
