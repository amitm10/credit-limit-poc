# Inside docker compose: Redis through Sentinel (primary + replica), Kafka on the compose network.
spring:
  data:
    redis:
      sentinel:
        master: credit-redis
        nodes: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  kafka:
    bootstrap-servers: kafka:9092

credit:
  # Each reservation waits (up to 5 ms) for the replica to confirm it.
  wait-replicas: 1
